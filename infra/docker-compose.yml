# ReggieSpace Social Studio — full stack for dokploy / local dev.
# Local dev: `docker compose -f infra/docker-compose.yml up -d postgres redis`
# Full stack: `docker compose -f infra/docker-compose.yml up --build`

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-giq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-giq_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-giq_studio}
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-giq}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.worker
    restart: unless-stopped
    environment:
      WORKER_SHARED_SECRET: ${WORKER_SHARED_SECRET}
      STORAGE_DIR: /data/storage
      WEB_BASE_URL: http://web:3000
      PUBLIC_MEDIA_BASE_URL: ${PUBLIC_MEDIA_BASE_URL:-http://localhost:3000/media}
      STORAGE_BACKEND: "${STORAGE_BACKEND:-local}"
      MEDIA_S3_BUCKET: "${MEDIA_S3_BUCKET:-}"
      MEDIA_S3_REGION: "${MEDIA_S3_REGION:-garage}"
      MEDIA_S3_ENDPOINT: "${MEDIA_S3_ENDPOINT:-}"
      MEDIA_PUBLIC_BASE_URL: "${MEDIA_PUBLIC_BASE_URL:-}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
    volumes:
      - mediadata:/data/storage
    expose:
      - "8000"
    networks:
      - default
      - garage

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-giq}:${POSTGRES_PASSWORD:-giq_dev_password}@postgres:5432/${POSTGRES_DB:-giq_studio}
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      FAL_KEY: ${FAL_KEY}
      FAL_IMAGE_MODEL: ${FAL_IMAGE_MODEL:-fal-ai/flux/dev}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}
      POSTIZ_API_KEY: ${POSTIZ_API_KEY}
      POSTIZ_BASE_URL: ${POSTIZ_BASE_URL}
      # The worker screenshots the app's own render route, so this must be
      # reachable from the worker container, not from the browser.
      WEB_BASE_URL: http://web:3000
      WORKER_BASE_URL: http://worker:8000
      WORKER_SHARED_SECRET: ${WORKER_SHARED_SECRET}
      STORAGE_DIR: /data/storage
      PUBLIC_MEDIA_BASE_URL: ${PUBLIC_MEDIA_BASE_URL}
      STORAGE_BACKEND: "${STORAGE_BACKEND:-local}"
      MEDIA_S3_BUCKET: "${MEDIA_S3_BUCKET:-}"
      MEDIA_S3_REGION: "${MEDIA_S3_REGION:-garage}"
      MEDIA_S3_ENDPOINT: "${MEDIA_S3_ENDPOINT:-}"
      MEDIA_PUBLIC_BASE_URL: "${MEDIA_PUBLIC_BASE_URL:-}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
    volumes:
      - mediadata:/data/storage
    ports:
      - "3000:3000"

volumes:
  pgdata:
  redisdata:
  mediadata:

networks:
  default: {}
  garage:
    external: true
    name: gastric-iq-social-media-garage-soixcp
