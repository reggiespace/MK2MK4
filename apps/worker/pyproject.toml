[project]
name = "reggiespace-studio-worker"
version = "1.0.0"
description = "ReggieSpace Social Studio — media worker (headless-Chromium slide rendering, ffmpeg reels)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "playwright>=1.49",
    "boto3>=1.35",
]

[project.optional-dependencies]
dev = ["ruff>=0.7", "pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.uvicorn]
host = "0.0.0.0"
port = 8000

[tool.ruff]
line-length = 100
